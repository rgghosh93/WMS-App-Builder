spring.application.name=wms-backend
# Settings for one computer only, such as the App Builder's API key; git ignores the file.
spring.config.import=optional:file:./local.properties
# Cloud platforms say which port to listen on.
server.port=${PORT:8080}

# Local dev database: file-based H2 in PostgreSQL mode, stored under backend/data/.
# For PostgreSQL, run with the "postgres" profile (see application-postgres.properties).
spring.datasource.url=jdbc:h2:file:./data/wms;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.username=wms
spring.datasource.password=

# Schema is owned by Flyway migrations; Hibernate only validates it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.locations=classpath:db/migration

# Load a small demo warehouse when the database is empty (local dev only).
wms.demo-data.enabled=true
# PIN of the demo device users PICKER1 and PICKER2 (local dev only).
wms.demo-data.user-pin=2468

# Load child collections (e.g. item packaging) in batches, not one query per row.
spring.jpa.properties.hibernate.default_batch_fetch_size=50

# Orders short of stock get it as soon as there is some; this is how often that is checked besides.
# wms.orders.allocate-waiting=false leaves it to "Allocate again".
wms.orders.waiting-interval-seconds=60

# How often replenishment rules are worked out. wms.replenishment.automatic=false leaves it to "Run now".
wms.replenishment.interval-seconds=60

# The App Builder: people describe a change and an agent builds it on a branch of its own. Off unless switched on, and
# only ever switched on where changes are built (wms-builder), never where the WMS is run for real. Needs ANTHROPIC_API_KEY.
wms.builder.enabled=${WMS_BUILDER_ENABLED:false}
# The repository and branch changes start from (a path or a URL), the branch accepted changes are merged into (which
# wms-builder runs), and where each change request gets its own checkout.
wms.builder.source=${WMS_BUILDER_SOURCE:..}
wms.builder.base-branch=${WMS_BUILDER_BASE_BRANCH:builder}
wms.builder.accept-branch=${WMS_BUILDER_ACCEPT_BRANCH:builder}
# For a GitHub source: a token that can read and write the repository's contents. Kept away from what the agent runs.
wms.builder.github-token=${WMS_BUILDER_GITHUB_TOKEN:}
wms.builder.workdir=${WMS_BUILDER_WORKDIR:${java.io.tmpdir}/wms-builder}
wms.builder.model=${WMS_BUILDER_MODEL:claude-opus-5-5}
# A change request's own copy can be started on this computer to try it, on one of these ports.
wms.builder.previews=${WMS_BUILDER_PREVIEWS:true}
wms.builder.preview-ports=8090-8094
