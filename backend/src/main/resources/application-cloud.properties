# Running in the cloud, behind the platform's HTTPS proxy. Use with the postgres profile: postgres,cloud.

# Trust the proxy's X-Forwarded-* headers, so cookies are marked secure and addresses are the real ones.
server.forward-headers-strategy=native
server.tomcat.remoteip.internal-proxies=.*

# Nobody is on the computer it runs on, so the first administrator is made with the setup key only.
wms.setup.on-this-computer=false
wms.setup.key=${WMS_SETUP_KEY:}

# The demo warehouse, for environments that want one. Its device users get this PIN; without one they get none.
wms.demo-data.enabled=${WMS_DEMO_DATA:false}
wms.demo-data.user-pin=${WMS_DEMO_PIN:}

# Leave headroom for the database's connection limit on small plans.
spring.datasource.hikari.maximum-pool-size=${WMS_DB_POOL:10}
