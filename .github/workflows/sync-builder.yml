# Brings every change to main into the builder branch, which Render deploys to wms-builder.
# The merge is tested first. If it clashes or a test fails, nothing is pushed: a pull request from main into builder
# says what needs sorting out, and wms-builder keeps running what it had.
name: Sync builder

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-builder

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Merge main into builder
        id: merge
        run: |
          git config user.name "wms-sync"
          git config user.email "wms-sync@users.noreply.github.com"
          if ! git ls-remote --exit-code --heads origin builder > /dev/null; then
            # First time: builder starts as a copy of main.
            git push origin HEAD:refs/heads/builder
            echo "result=created" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git checkout -B builder origin/builder
          if git merge-base --is-ancestor origin/main HEAD; then
            echo "result=current" >> "$GITHUB_OUTPUT"
          elif git merge --no-edit origin/main; then
            echo "result=merged" >> "$GITHUB_OUTPUT"
          else
            git merge --abort
            echo "result=conflict" >> "$GITHUB_OUTPUT"
          fi

      - name: Test the merged result
        id: test
        if: steps.merge.outputs.result == 'merged'
        continue-on-error: true
        run: |
          (cd frontend && npm ci --no-audit --no-fund && npx tsc --noEmit -p . && npx vitest run)
          (cd backend && sh mvnw -B test -Dwms.test.postgres=true)

      - name: Push to builder
        if: steps.merge.outputs.result == 'merged' && steps.test.outcome == 'success'
        run: git push origin builder

      - name: Ask for help
        if: steps.merge.outputs.result == 'conflict' || (steps.merge.outputs.result == 'merged' && steps.test.outcome != 'success')
        run: |
          if [ "${{ steps.merge.outputs.result }}" = conflict ]; then
            why="Changes on main clash with changes on builder, so they could not be merged."
          else
            why="main merges into builder, but the tests fail on the result."
          fi
          existing=$(gh pr list --base builder --head main --state open --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh pr comment "$existing" --body "$why Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          else
            gh pr create --base builder --head main --title "Bring base changes into builder" --body "$why

          Nothing was deployed: wms-builder keeps running what it had. Resolve this pull request (or ask the App Builder to), and the merge deploys.

          Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          fi
          echo "::warning::$why A pull request into builder says so."
