# PostgreSQL. Either the whole JDBC URL, or its parts, which is what Render hands over.
spring.datasource.url=${WMS_DB_URL:jdbc:postgresql://${WMS_DB_HOST:localhost}:${WMS_DB_PORT:5432}/${WMS_DB_NAME:wms}}
spring.datasource.username=${WMS_DB_USER:wms}
spring.datasource.password=${WMS_DB_PASSWORD:}
wms.demo-data.enabled=false
