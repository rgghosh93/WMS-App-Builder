spring.application.name=wms-backend
spring.datasource.url=jdbc:h2:mem:wms-test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.locations=classpath:db/migration
wms.demo-data.enabled=false

# Load child collections (e.g. item packaging) in batches, not one query per row.
spring.jpa.properties.hibernate.default_batch_fetch_size=50
